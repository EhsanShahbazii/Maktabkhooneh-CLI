[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maktab-downloader"
version = "1.0.0"
description = "High-performance automated metadata scraper & course downloader for Maktabkhooneh"
authors = [{ name = "Ehsan Shahbazi", email = "ehsan.shahbazipc@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx[http2]>=0.28.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.3.0",
    "browser-cookie3>=0.19.0",
    "aiosqlite>=0.20.0",
    "aiofiles>=24.1.0",
    "pydantic>=2.7.0",
    "telethon>=1.36.0",
    "cryptg>=0.4.0",
]

[project.scripts]
maktab = "maktab_downloader.cli.app:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["maktab_downloader*"]
